 <linearGradient id="face" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#d8dedc"/><stop offset=".35" stop-color="#fafaf7"/><stop offset=".78" stop-color="#c9d1ce"/><stop offset="1" stop-color="#929e9a"/></linearGradient>
