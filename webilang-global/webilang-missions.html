const dialogs={en:{A2:{restaurant:{intro:'Good evening! Welcome to our restaurant. What would you like?',ask:'Our Golden Crunch is special. It has roasted crickets and honey. Would you like it?',reply:'Of course! You can choose another dish. Would you like our Forest Treasure?',hint:'What is it made of?',text:'The Golden Crunch is sweet and crunchy. It has crickets and honey.'},pompeii:{intro:'Hello! I am Marcus. I make bread. Can I help you?',ask:'A woman was here this morning. She had a red bag. She went to the market.',reply:'Yes, the market is near the fountain. Go left.',hint:'Where did she go?',text:'A woman came to the bakery at nine. She bought bread and went to the market.'},default:{intro:'Hello! I need your help. Can we talk about this problem?',ask:'That is interesting. What do you think we should do?',reply:'Good idea! Can you tell me why?',hint:'I think we should ... because ...',text:'We have a problem. We need to talk and choose a good solution.'}},B1:{restaurant:{intro:'Welcome! You may have heard about our mysterious special menu. Would you like to order?',ask:'Golden Crunch sounds ordinary, but it contains roasted crickets with honey and spices. Some guests love it; others are surprised.',reply:'I understand your concern. Would you prefer a vegetarian alternative or would you like to know more about the ingredients?',hint:'Could you explain what this dish is made of?',text:'The restaurant offers dishes with unusual ingredients. Customers can ask for details and decide whether to keep their order.'},pompeii:{intro:'Welcome to my bakery. You seem worried. Are you looking for someone?',ask:'A woman carrying a red bag came in shortly before nine. She left quickly when another customer arrived.',reply:'I think she went towards the market, but I cannot be certain. You could ask the fruit seller.',hint:'Did you notice anything unusual about her?',text:'Marcus remembers a visitor who seemed nervous and disappeared after another customer entered the bakery.'},default:{intro:'Welcome. We have an interesting problem to solve. What would you suggest?',ask:'I can see both advantages and disadvantages. How would you explain your choice to the others?',reply:'That sounds reasonable. What could go wrong with your plan?',hint:'On the one hand ..., but on the other hand ...',text:'The team has limited resources and must agree on a solution that works for everyone.'}}},ru:{A2:{restaurant:{intro:'Добрый вечер! Добро пожаловать в наш ресторан. Что будете заказывать?',ask:'Наше блюдо «Золотой хруст» необычное. Там жареные сверчки и мёд. Будете пробовать?',reply:'Конечно! Можно выбрать другое блюдо. Хотите «Лесной секрет»?',hint:'Из чего это сделано?',text:'«Золотой хруст» — сладкое и хрустящее блюдо. В нём сверчки и мёд.'},pompeii:{intro:'Здравствуйте! Меня зовут Марк. Я пекарь. Чем могу помочь?',ask:'Сегодня утром здесь была женщина. У неё была красная сумка. Она пошла на рынок.',reply:'Да, рынок рядом с фонтаном. Идите налево.',hint:'Куда она пошла?',text:'Женщина пришла в пекарню в девять. Она купила хлеб и пошла на рынок.'},default:{intro:'Здравствуйте! Мне нужна ваша помощь. Давайте обсудим проблему.',ask:'Интересная идея. Что, по-вашему, нам нужно сделать?',reply:'Хорошая мысль! Почему вы так думаете?',hint:'Я думаю, что нам нужно ... потому что ...',text:'У нас проблема. Нужно поговорить и выбрать хорошее решение.'}},B1:{restaurant:{intro:'Добро пожаловать! Наверное, вы уже слышали о нашем необычном меню. Что хотите заказать?',ask:'Название «Золотой хруст» звучит обычно, но в блюде жареные сверчки, мёд и специи. Не все гости готовы к такому сюрпризу.',reply:'Понимаю вас. Предпочитаете вегетарианский вариант или хотите узнать больше об ингредиентах?',hint:'Не могли бы вы рассказать, из чего приготовлено это блюдо?',text:'Ресторан предлагает необычные блюда. Гости могут уточнить ингредиенты и решить, оставлять заказ или нет.'},pompeii:{intro:'Добро пожаловать в мою пекарню! Вы, кажется, кого-то ищете?',ask:'Незадолго до девяти зашла женщина с красной сумкой. Она быстро ушла, когда появился другой посетитель.',reply:'Кажется, она направилась к рынку, но я не совсем уверен. Попробуйте расспросить продавца фруктов.',hint:'Вы заметили что-нибудь необычное?',text:'Пекарь помнит посетительницу, которая заметно нервничала и ушла после появления другого покупателя.'},default:{intro:'Здравствуйте. Нам предстоит решить непростую задачу. Что вы предлагаете?',ask:'Я вижу преимущества и недостатки. Как бы вы объяснили ваше решение другим?',reply:'Звучит разумно. А какие трудности могут возникнуть?',hint:'С одной стороны ..., но с другой стороны ...',text:'У команды ограниченные ресурсы. Нужно найти решение, которое устроит всех.'}}}};
const state={page:'home',target:'en',level:'A2',mission:'restaurant',attempt:1,turn:0,stage:'speak',log:[],help:'phrase',modal:'',reveal:false,selected:{word:true,grammar:true},savedWords:[],savedGrammar:[],practiceChoice:null,practiceDone:false,teamMessages:[{name:'Emma',text:'I talked to the waiter. He knows something about the special menu!',time:'16:42'},{name:'Lev',text:'Interesting! I found a clue in the old menu. What did he tell you?',time:'16:47'},{name:'Anna',text:'I can join after my English class. Keep the clue for me!',time:'17:03'}],filter:'All',join:true,reflected:false,teacherAssigned:false};
function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function m(){return missions.find(x=>x.id===state.mission)||missions[0]}
function line(){const lang=dialogs[state.target][state.level];return lang[state.mission]||lang.default}
function commonHead(eyebrow,title,sub){return `<div class="eyebrow">${eyebrow}</div><h1 class="h1">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
function cardFor(item){return `<article class="card mission-card"><div class="art ${item.id}"><span class="emoji">${item.emoji}</span><span class="tag ghost" style="position:absolute;top:12px;left:12px;z-index:2">${item.kind}</span></div><div class="mission-info"><h3>${item.name}</h3><p>${item.desc}</p><div class="pill-list"><span class="tag ghost">${item.meta}</span><span class="tag ghost">${item.mode}</span></div><button class="btn tiny" onclick="startMission('${item.id}')">Explore mission →</button></div></article>`}
function renderHome(){return `${commonHead('YOUR PERSONAL LEARNING SPACE','Ready for your next mission?','Use the language to make something happen — and learn from every conversation.')}
<div class="hero"><div class="hero-copy"><span class="tag" style="background:#ffffff24;color:#fff">✦ Your current mission · ${state.level}</span><h1>The Secret Restaurant</h1><p>Enter a mysterious café. Talk to its waiter, discover surprising ingredients, and decide what to do. Each new attempt helps you speak more independently.</p><button class="btn" onclick="startMission('restaurant')">▶ ${state.log.length?'Continue mission':'Start mission'}</button></div></div>
<div class="four" style="margin:18px 0 30px"><div class="stat"><small>Language level</small><div class="num">${state.level}</div><small>${state.target==='en'?'English':'Russian'}</small></div><div class="stat"><small>AI conversations</small><div class="num">${Math.max(3,state.attempt-1)}</div><small>Illustrative progress</small></div><div class="stat"><small>Words saved</small><div class="num">${state.savedWords.length+8}</div><small>My Word Stock</small></div><div class="stat"><small>Your next challenge</small><div class="num">1</div><small>Team invitation</small></div></div>
<div class="two"><section><div class="section-head"><h2 class="h2">Explore missions</h2><button class="link" onclick="navigate('missions')">See all missions →</button></div><div class="three">${missions.slice(0,3).map(cardFor).join('')}</div></section><section class="stack"><div class="k-card"><div class="flex gap12"><div class="k-face">🎓</div><div><h3>Kostya recommends</h3><span class="tiny-muted">Your learning priority</span></div></div><p>Try asking for clarification when you do not understand. After your next roleplay, review your feedback and practise one useful expression.</p><button class="btn soft tiny" onclick="openKostya()">Talk to Kostya →</button></div><div class="card pad"><div class="section-head" style="margin:0 0 10px"><h3 style="margin:0">Your team is gathering</h3><span class="tag">3 online*</span></div><p class="sub">Join the Secret Restaurant team to compare clues and practise with other learners.</p><button class="btn outline" onclick="navigate('teams')">Open team space →</button><p class="tiny-muted">*Demo participants</p></div></section></div>
<div class="meet-banner" style="margin-top:22px"><div><div class="eyebrow" style="margin-bottom:6px">LIVE LANGUAGE EXCHANGE</div><h3>Meet a student. Speak together.</h3><p>Invite a partner into a video room, choose a mission, and communicate in English or Russian.</p></div><button class="btn" onclick="launchMeet('chat')">◉ Meet &amp; Speak →</button></div>
<div class="card pad" style="margin-top:22px"><div class="flex between gap12" style="flex-wrap:wrap"><div><h3 style="margin:0 0 5px">📚 Your Webilang Modules</h3><p class="sub" style="margin:0">Video Games · Gender Roles · Russian Unit 3</p></div><button class="btn outline" onclick="navigate('modules')">Browse modules →</button></div></div>
<div class="section-head" style="margin-top:29px"><h2 class="h2">Your learning cycle</h2></div><div class="card pad"><div class="steps">${['① Speak','② AI Feedback','③ Save','④ Practise','⑤ Speak again','⑥ Reflect'].map((x,i)=>`<span class="step-pill ${i===0?'current':''}">${x}</span>`).join('')}</div><p class="sub" style="margin-bottom:0">Your existing Webilang method stays at the centre of every mission. Teamwork, stories and achievements build on it.</p></div>`}
function renderMissions(){const filters=['All','Mystery','Time Travel','Create Together','Moral Dilemma','Art Project','Culture Exchange','Social Game','Roleplay'];const visible=state.filter==='All'?missions:missions.filter(x=>x.kind===state.filter);return `${commonHead('THE MISSION LIBRARY','Choose your challenge','One mission adapts to the student’s level. Investigate, create, decide, play — alone or in a team.')}
<div class="tabs" style="margin:23px 0">${filters.map(x=>`<button class="tab ${state.filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="three">${visible.map(cardFor).join('')}</div><div class="info-banner" style="margin-top:20px">Prototype: all scenarios share the same conversation → feedback → personalised practice cycle. Different plots are illustrative; only one conversational sample is implemented per mission.</div>`}
function stageTab(stage,label){return `<button class="step-pill ${state.stage===stage?'current':''} ${['feedback','stock','practice','replay','reflect'].indexOf(state.stage)>['feedback','stock','practice','replay','reflect'].indexOf(stage)&&state.stage!=='speak'?'done':''}" onclick="setStage('${stage}')">${label}</button>`}
function renderMission(){let d=line(),ms=m();return `<div class="flex between gap12" style="margin-bottom:15px;flex-wrap:wrap"><button class="btn outline tiny" onclick="navigate('missions')">← All missions</button><span class="tag orange">${ms.kind} · ${state.level} · ${state.target==='en'?'English':'Russian'}</span></div><h1 class="h1" style="margin-top:0">${ms.emoji} ${ms.name}</h1><p class="sub">${ms.goal}</p><div class="steps" style="margin:20px 0">${stageTab('speak','1 · Speak')}${stageTab('feedback','2 · Feedback')}${stageTab('stock','3 · Save')}${stageTab('practice','4 · Practise')}${stageTab('replay','5 · Replay')}${stageTab('reflect','6 · Reflect')}</div>
${state.stage==='speak'?renderSpeak(ms,d):state.stage==='feedback'?renderFeedback():state.stage==='stock'?renderStock():state.stage==='practice'?renderPractice():state.stage==='replay'?renderReplay():renderReflect()}`}
function renderSpeak(ms,d){return `<div class="mission-layout"><section class="card scene"><div class="scene-banner ${ms.id}"><span class="live-pill">● AI roleplay · attempt ${state.attempt}</span><div class="scene-emoji">${ms.emoji}</div></div><div class="scene-body"><div class="flex between gap8" style="margin-bottom:12px"><div><strong>${ms.character}</strong><div class="tiny-muted">Character · ${state.level} language adaptation</div></div><span class="speak-status">◉ Conversation sample</span></div><div class="chatlog" id="chatlog" aria-live="polite">${state.log.map((x)=>`<div class="msg ${x.who==='You'?'user':'bot'}"><span class="who">${safe(x.who)}</span>${safe(x.text)}</div>`).join('')}</div><form class="composer" onsubmit="sendChat(event)"><input id="chatInput" placeholder="${state.target==='ru'?'Напишите, что вы хотите сказать…':'Type what you would say…'}" aria-label="Message to avatar" required autocomplete="off"><button class="btn round" title="Send message" aria-label="Send message">➤</button></form><div class="flex between" style="margin-top:11px;gap:7px;flex-wrap:wrap"><span class="tip">Demo dialogue is typed. Live voice/Qwen is not connected.</span><button class="btn tiny outline" onclick="showVoiceNotice()">🎤 Voice demo</button></div></div></section><aside class="stack"><section class="card pad"><div class="flex between gap8"><h3 style="margin:0">🎯 Your mission</h3><span class="tag ghost">Attempt ${state.attempt}</span></div><p class="sub">${ms.goal}</p><div class="progress-rail"><div class="progress-row"><span>Start talking to the character</span><strong>${state.turn>=1?'✓':'○'}</strong></div><div class="progress-row"><span>Ask or respond to new information</span><strong>${state.turn>=2?'✓':'○'}</strong></div><div class="progress-row"><span>Make a decision or suggestion</span><strong>${state.turn>=3?'✓':'○'}</strong></div></div><div class="divider"></div><button class="btn soft" style="width:100%" onclick="openMagic()">✦ Open Magic Box</button><p class="tip">Language help · Listening help · Detective hint</p></section><section class="card pad"><h3 style="margin:0 0 10px">📎 Scene materials</h3><p class="sub">${safe(d.text)}</p><div class="flex gap8" style="flex-wrap:wrap"><button class="btn outline tiny" onclick="showSceneMaterial()">Read / listen</button><button class="btn outline tiny" onclick="navigate('teams')">Team chat</button></div></section><section class="card pad"><h3 style="margin:0 0 9px">Ready to learn from this attempt?</h3><p class="sub">After speaking, review a sample of the AI Feedback and choose what to save.</p><button class="btn" onclick="setStage('feedback')">Finish → AI Feedback</button></section></aside></div>`}
function renderFeedback(){const enough=state.turn>=2;return `<div class="two"><section class="card pad"><div class="eyebrow">STEP 2 · AI FEEDBACK</div><h2 class="h2" style="margin-top:8px">What happened in your conversation?</h2><p class="sub">This is an example feedback report for the prototype, not an AI assessment of your typed messages.</p><div class="three" style="margin:18px 0"><div class="feedback-stat"><span class="tiny-muted">Communication</span><b>${enough?'Goal explored':'First attempt'}</b><span class="tiny-muted">Meaning first</span></div><div class="feedback-stat"><span class="tiny-muted">Listening</span><b>Review</b><span class="tiny-muted">Check key details</span></div><div class="feedback-stat"><span class="tiny-muted">Grammar</span><b>1 focus</b><span class="tiny-muted">Example to practise</span></div></div><div class="note"><strong>✓ Communication first.</strong> ${enough?'You asked questions and responded to the character. Keep using clarification questions to understand more.':'Start the roleplay and ask at least two questions or make two responses. You can also explore this sample feedback.'}</div><h3 style="font-size:15px;margin-top:19px">Example corrections for this mission</h3><div class="checkline"><span>🧩</span><div><strong>Grammar</strong><br>${state.target==='en'?'<s>I want know the ingredients.</s> → I want <b>to know</b> the ingredients.':'<s>Я хочу знать ингредиент.</s> → Я хочу знать <b>ингредиенты</b>.'}</div></div><div class="checkline"><span>📚</span><div><strong>Vocabulary</strong><br>${state.target==='en'?'<b>What is it made of?</b> — ask about ingredients.':'<b>Из чего это сделано?</b> — спросить о составе блюда.'}</div></div><button class="btn" onclick="setStage('stock')">Choose what to save →</button></section><aside class="stack"><div class="k-card"><div class="flex gap8"><div class="k-face">🎓</div><strong>Kostya sees your feedback</strong></div><p>Kostya can discuss your communication goal and explain the corrections you choose. He does not have access to a live AI transcript in this prototype.</p><button class="btn soft tiny" onclick="openKostya()">Reflect with Kostya</button></div><div class="card pad"><h3>Evidence matters</h3><p class="sub">In the finished product, feedback must reference actual speech/transcript excerpts, distinguish speech-recognition errors and avoid inventing comprehension scores.</p></div></aside></div>`}
function renderStock(){const gram=state.target==='en'?'I want to know the ingredients.':'Я хочу знать ингредиенты.';const voc=state.target==='en'?'What is it made of?':'Из чего это сделано?';return `<div class="two"><section class="card pad"><div class="eyebrow">STEP 3 · YOUR CHOICE</div><h2 class="h2" style="margin-top:8px">Save what you want to learn</h2><p class="sub">Select useful items from your feedback. Only the ones you choose are sent to your personal stocks.</p><label class="checkline"><input type="checkbox" id="wordCheck" ${state.selected.word?'checked':''} onchange="state.selected.word=this.checked"><span>📚 <strong>My Word Stock</strong><br>${voc}</span></label><label class="checkline"><input type="checkbox" id="grammarCheck" ${state.selected.grammar?'checked':''} onchange="state.selected.grammar=this.checked"><span>🧩 <strong>My Grammar Stock</strong><br>${gram}</span></label><div class="flex gap8" style="margin-top:18px;flex-wrap:wrap"><button class="btn" onclick="saveStocks()">Save selected items →</button><button class="btn outline" onclick="setStage('practice')">Skip to practice</button></div></section><aside class="card pad"><h3 style="margin-top:0">Personal learning, not a generic vocabulary list</h3><p class="sub">In Webilang, the items should come from this student's actual conversation. Here they are predefined examples, so you can test the interaction.</p><div class="note">Personal practice will use the selected phrase or grammar structure.</div></aside></div>`}
function renderPractice(){const ru=state.target==='ru';const opts=ru?['Из чего сделано это блюдо?','Что блюдо сделано?','Где сделано это блюдо?']:['What is it made of?','What it is made from?','What is made it?'];const q=ru?'Как правильно спросить официанта об ингредиентах?':'How can you ask the waiter about the ingredients?';return `<div class="two"><section class="card pad"><div class="eyebrow">STEP 4 · TARGETED PRACTICE</div><h2 class="h2" style="margin-top:8px">Practise the language you need</h2><p class="sub">A demonstration exercise based on the sample feedback. The live platform would generate exercises using your saved mistakes.</p><div class="note" style="margin:15px 0"><strong>${q}</strong></div><div class="stack" style="gap:9px">${opts.map((o,i)=>`<button class="answer-option ${state.practiceChoice===i?(i===0?'correct':'wrong'):''}" onclick="choosePractice(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${state.practiceChoice!==null?`<div class="note" style="margin-top:15px">${state.practiceChoice===0?'✓ Correct. You can now use this question in your next conversation.':'Not quite. Try again — look at the question structure.'}</div>`:''}<div class="flex gap8" style="margin-top:17px;flex-wrap:wrap"><button class="btn" onclick="setStage('replay')">Repeat the roleplay →</button><button class="btn outline" onclick="state.practiceChoice=null;render()">Try exercise again</button></div></section><aside class="card pad"><h3 style="margin-top:0">Your practice path</h3><p class="sub">The learner chooses which errors matter. The application generates short exercises, then returns the learner to a new conversational attempt.</p><div class="progress-rail"><div class="progress-row"><span>Recognise a useful phrase</span><strong>01</strong></div><div class="progress-row"><span>Build the sentence</span><strong>02</strong></div><div class="progress-row"><span>Use it while speaking</span><strong>03</strong></div></div></aside></div>`}
function renderReplay(){return `<div class="two"><section class="card pad"><div class="eyebrow">STEP 5 · SPEAK AGAIN</div><h2 class="h2" style="margin:8px 0">Try again — more independently</h2><p class="sub">Replay the conversation with the same mission or a small change. Your goal is to communicate more effectively, not to memorise one exact script.</p><div class="result-trophy"><div>🎟️</div><h3 style="margin:4px 0">Mission outcome</h3><p class="sub">In the real module, a story reward is unlocked when the mission criteria are met. Both accepting and refusing a strange dish can count as success.</p><span class="tag orange">Reward preview · Golden Menu Card</span></div><div class="flex gap8" style="margin-top:17px;flex-wrap:wrap"><button class="btn" onclick="replay()">↻ Start attempt ${state.attempt+1}</button><button class="btn outline" onclick="setStage('reflect')">Reflect with Kostya →</button></div></section><aside class="card pad"><h3 style="margin-top:0">Why repeat?</h3><p class="sub">The learner gets another opportunity to apply feedback. After rehearsal, change one feature of the scene to test genuine transfer.</p><div class="note">Same communicative objective.<br>New opportunities to respond.<br>Optional Magic Box support.</div></aside></div>`}
function renderReflect(){return `<div class="two"><section class="card pad"><div class="eyebrow">STEP 6 · REFLECT & GROW</div><h2 class="h2" style="margin-top:8px">What would you do differently?</h2><p class="sub">Kostya should review the actual conversation and AI Feedback, then help you choose one useful priority. Beginners may reflect in their first language.</p><label for="reflection" style="display:block;font-weight:750;font-size:13px;margin-bottom:9px">Your reflection</label><textarea id="reflection" class="input" style="width:100%;min-height:120px" placeholder="I understood the waiter, but it was hard to ask about ingredients…"></textarea><div class="flex gap8" style="flex-wrap:wrap;margin-top:15px"><button class="btn" onclick="saveReflection()">Save reflection</button><button class="btn soft" onclick="openKostya()">🎓 Talk to Kostya</button></div>${state.reflected?'<div class="note" style="margin-top:12px">✓ Reflection saved in this demonstration session.</div>':''}</section><aside class="card pad"><h3 style="margin-top:0">Next mission</h3><p class="sub">Return to your team, choose a new challenge, or create something for your portfolio.</p><div class="stack" style="gap:8px"><button class="btn outline" onclick="navigate('teams')">Join a team →</button><button class="btn outline" onclick="navigate('creations')">My Creations →</button><button class="btn outline" onclick="navigate('missions')">Choose a new mission →</button></div></aside></div>`}

<script type="module" src="/webilang-global/missions-online.js"></script>
<script>
(() => {
  function addAI() {
    if (document.querySelector('#ai-c1-module-card')) return;

    const title = [...document.querySelectorAll('h2,h3,h4')]
      .find(el => el.textContent.trim().startsWith('Gender Roles'));

    if (!title) return;

    const original = title.closest('.card');
    if (!original) return;

    const card = original.cloneNode(true);
    card.id = 'ai-c1-module-card';

    card.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));

    card.querySelector('h2,h3,h4').textContent =
      'AI: Opportunities & Risks · C1';

    const description = card.querySelector('p');
    if (description) description.textContent =
      'Explore real AI cases, documentaries, Nick Cave and a live ATLAS roleplay.';

    const links = card.querySelectorAll('a');
    links.forEach((link, index) => {
      if (index === 0) {
        link.href = '/ai/';
        link.textContent = 'Open module ↗';
      } else {
        link.remove();
      }
    });

    card.querySelectorAll('.tag').forEach(tag => {
      if (tag.textContent.trim() === 'B2') tag.textContent = 'C1';
    });

    original.after(card);
  }

  document.addEventListener('DOMContentLoaded', () => {
    addAI();
    new MutationObserver(addAI).observe(document.body, {
      childList: true,
      subtree: true
    });
  });
})();
</script></body>
