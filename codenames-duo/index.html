<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webilang · Code Names Duo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#163b42;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#11746d}.card{border:1px solid #dde8e4;border-radius:18px;background:white;padding:20px;margin-top:18px;box-shadow:0 4px 20px #1234}h1{margin:6px 0;font-size:clamp(25px,4vw,38px)}h2{margin:0 0 12px}.muted{color:#58716f}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:block;font-size:13px;font-weight:700;margin:8px 0}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #bcd0cc;width:100%}button{cursor:pointer;background:#18766c;color:white;font-weight:750;border:0}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e8f2ef;color:#215f59}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{width:auto}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:16px 0}.tile{aspect-ratio:1.3;min-height:63px;background:#e9f1ef;color:#173c41;border:2px solid #dae7e4;font-weight:800;overflow-wrap:anywhere;font-size:clamp(11px,2vw,17px)}.tile.target{background:#2b987f;color:white}.tile.neutral{background:#b4bdc4;color:#13282e}.tile.danger{background:#b94e50;color:white}.tile.open{opacity:.8}.tile:disabled{opacity:1}.status{background:#e8f3f0;padding:14px;border-radius:12px;font-weight:750}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:18px}.chat{max-height:230px;overflow-y:auto;background:#f4f8f7;padding:12px;border-radius:12px;min-height:100px}.chat p{margin:6px 0}.hidden{display:none!important}.banner{color:#b64c34;font-weight:700;min-height:1.5em}.small{font-size:12px}.role{font-size:22px;font-weight:850;color:#14746c}@media(max-width:720px){.split{grid-template-columns:1fr}.shell{padding:12px}.card{padding:13px}.board{gap:5px}.tile{padding:3px;min-height:56px}}
</style></head><body><div class="shell"><header><div><a href="/webilang-global/codenames.html">← All Code Names modes</a><h1>🕵️ Code Names Duo</h1><span class="muted">2 players · switch roles · no robot</span></div><a href="/">Webilang</a></header>
<section id="setup" class="card"><h2>New game</h2><div class="settings"><div><label>Language</label><select id="lang"><option value="en">English</option><option value="ru">Русский</option></select></div><div><label>Topic</label><select id="topic"><option value="general">General</option><option value="video">Video Games</option><option value="gender">Gender Roles</option></select></div><div><label>Level</label><select id="level"><option value="easy">A1–A2–B1</option><option value="hard">B2–C1–C2</option></select></div><div><label>Mode</label><select id="challenge"><option value="0">Classic clues</option><option value="1">Speaking Challenge</option></select></div></div><div class="actions" style="margin-top:18px"><button id="create">Create a Duo room</button></div><hr><h2>Join a partner</h2><div class="settings"><div><label>Six-character room code</label><input id="joinCode" maxlength="12" placeholder="AB12CD"></div><div><label>Your display name</label><input id="name" maxlength="32" placeholder="Player B"></div></div><div class="actions" style="margin-top:12px"><button id="join">Join room</button></div></section>
<section id="game" class="hidden"><div class="card"><h2 id="room"></h2><p class="muted" id="settingsLine"></p><p class="status" id="status"></p><p class="role" id="role"></p><p class="banner" id="error"></p><div class="actions"><button class="secondary" id="copy">Copy invitation</button><button class="secondary" id="reset">New board — same players</button><button class="secondary" id="leave">Leave on this device</button></div></div><div class="split"><section class="card"><h2>Word board</h2><p class="muted small" id="boardInfo"></p><div class="board" id="board"></div><div id="clueBox" class="hidden"><h2>Give a clue</h2><div class="settings"><div><label>One word</label><input id="clue" placeholder="sky"></div><div><label>Number</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div><button id="send" style="margin-top:12px">Give clue</button></div><div id="guessBox" class="hidden"><p id="clueDisplay" class="status"></p><p class="muted" id="guessHint"></p><button id="pass">Pass turn / Switch roles</button></div></section><aside class="card"><h2>Shared mission</h2><p id="score"></p><div id="history" class="small"></div><h2 style="margin-top:22px">Room chat</h2><div class="chat" id="chat"></div><form id="chatForm"><label for="message">Message</label><input id="message" maxlength="350" placeholder="Explain your choice..."><button style="margin-top:8px">Send message</button></form><p class="small muted">Use Webilang Video or another call to speak. Chat messages are visible to both players.</p></aside></div></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),endpoint='/api/codenames-duo';let session=null,state=null,fetching=false;const KEY='webilang-duo-session';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const showError=e=>{$('error').textContent=e||'';};
async function api(action,extra={}){const body={action,...extra};if(session){body.code=session.code;body.token=session.token;}const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Error ${r.status}`);return d;}
function setSession(d){session={code:d.code||d.state.code,token:d.token,seat:d.state.seat};sessionStorage.setItem(KEY,JSON.stringify(session));state=d.state;render();}
async function move(action,extra){try{showError('');const d=await api(action,extra);if(d.state){state=d.state;render();}}catch(e){showError(e.message);}}
$('create').onclick=async()=>{try{const d=await api('create',{lang:$('lang').value,topic:$('topic').value,level:$('level').value,challenge:$('challenge').value==='1'});setSession(d);}catch(e){showError(e.message);alert(e.message);}};
$('join').onclick=async()=>{try{const d=await api('join',{code:$('joinCode').value,name:$('name').value});setSession(d);}catch(e){alert(e.message);}};
$('send').onclick=()=>move('clue',{word:$('clue').value,count:Number($('count').value)});$('pass').onclick=()=>move('pass');$('reset').onclick=()=>{if(confirm('Create new words and maps for both players?'))move('reset');};$('copy').onclick=async()=>{const link=location.origin+'/codenames-duo/?room='+encodeURIComponent(session.code);try{await navigator.clipboard.writeText(link);$('copy').textContent='Invitation copied ✓';}catch(e){prompt('Copy invitation',link);}};
$('leave').onclick=()=>{sessionStorage.removeItem(KEY);location.href='/webilang-global/codenames.html';};$('chatForm').onsubmit=e=>{e.preventDefault();const message=$('message').value.trim();if(message){move('chat',{message});$('message').value='';}};
function render(){if(!session||!state)return;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent='Room '+state.code+' · You are Player '+(state.seat?'B':'A');$('settingsLine').textContent=`${state.settings.lang==='ru'?'Russian':'English'} · ${state.settings.topic} · ${state.settings.level==='easy'?'A1–B1':'B2–C2'} · ${state.settings.challenge?'Speaking Challenge':'Classic'}`;const sp=state.seat===state.turn;const joined=state.joined;const phase=state.phase;$('status').textContent=!joined?'Waiting for a second player to join…':state.finished?(state.score===12?'🏆 Mission complete!':'💥 Game over — start a new board'):phase==='clue'?`Player ${state.turn?'B':'A'} gives a clue`:`Clue: ${state.clue?.word||''} · ${state.clue?.count||''}`;$('role').textContent=state.finished?'Completed':sp?'🔐 Your role: SPYMASTER':'🔎 Your role: GUESSER';$('boardInfo').textContent=sp?'Your private colour map is shown for this turn.':'You cannot see your partner’s secret colours.';const board=$('board');board.replaceChildren();for(let i=0;i<state.words.length;i++){const b=document.createElement('button');b.type='button';b.className='tile';const owner=state.turn;const visible=state.visibleMap?.[i];const opened=state.revealed[owner][i];if(visible)b.classList.add(visible);if(opened){b.classList.add('open');if(!visible&&state.openColors?.[owner]?.[i])b.classList.add(state.openColors[owner][i]);}b.textContent=state.words[i];b.disabled=!joined||sp||phase!=='guess'||opened||state.finished;if(!b.disabled)b.onclick=()=>move('guess',{index:i});board.appendChild(b);}$('clueBox').classList.toggle('hidden',!(joined&&sp&&phase==='clue'&&!state.finished));$('guessBox').classList.toggle('hidden',!(joined&&!sp&&phase==='guess'&&!state.finished));$('clueDisplay').textContent=`${state.clue?.word||''} — ${state.clue?.count||''}`;$('guessHint').textContent=`${state.remaining} guesses remaining. ${state.settings.challenge?'Explain each choice aloud or in chat.':''}`;$('score').textContent=`🎯 Target words found: ${state.score} / 12`;$('history').innerHTML=state.history.map(h=>`<p><b>${h.seat?'B':'A'}:</b> ${esc(h.message)}</p>`).join('');$('chat').innerHTML=state.chat.map(h=>`<p><b>${h.seat?'B':'A'}:</b> ${esc(h.message)}</p>`).join('');}
async function poll(){if(!session||fetching)return;fetching=true;try{const u=new URL(endpoint,location.origin);u.searchParams.set('code',session.code);u.searchParams.set('token',session.token);const r=await fetch(u);const d=await r.json();if(!r.ok)throw Error(d.error||'Connection error');if(!state||state.version!==d.state.version){state=d.state;render();showError('');}}catch(e){showError('Sync: '+e.message);}finally{fetching=false;}}
try{const s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(s?.code&&s?.token){session=s;poll();}}catch(e){}const room=new URLSearchParams(location.search).get('room');if(room)$('joinCode').value=room;setInterval(poll,1800);
})();</script></body></html>
